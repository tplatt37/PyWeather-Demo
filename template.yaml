AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Creates the PyWeatherDemo Lambda - a simple Python3.x Lambda function that helps showcase the basic features of Lambda.

Parameters:
  SecretArn:
    Type: String
    Default: "arn:aws:secretmanager:REGION:ACCOUNTID:secret:SECRETNAME"
    Description: "Enter the ARN of the Secrets Manager Secret that holds the OpenWeatherMap API Key (You must create this yourself!)"

Globals:
  Function:
    Timeout: 30

Resources:
  PyWeatherDemo:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
        - x86_64 
        #- arm64 
      Timeout: 30
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:        # Policy template with placeholder value
            SecretArn: !Ref SecretArn
      Events:
        PyWeatherDemo:
          Type: Api 
          Properties:
            Path: /weather
            Method: get
            RestApiId: !Ref PyWeatherApi
  #
  # We have a custom Lambda Authorizer on this version
  #
  PyWeatherApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: CustomAuthorizer
        Authorizers:
          CustomAuthorizer:
            FunctionArn: !GetAtt AuthorizerLambdaFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - X-Forwarded-For

  AuthorizerLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: authorizer.handler
      Runtime: nodejs18.x
      CodeUri: authorizer/

Outputs:
  # API Gateway endpoint as an output, for convenience
  PyWeatherDemoRESTApi:
    Description: "API Gateway endpoint URL for Prod stage - change the city as desired."
    Value: !Sub "https://${PyWeatherApi}.execute-api.${AWS::Region}.amazonaws.com/prod/weather?city=Scranton"

  PyWeatherDemo:
    Description: "Function ARN."
    Value: !GetAtt PyWeatherDemo.Arn